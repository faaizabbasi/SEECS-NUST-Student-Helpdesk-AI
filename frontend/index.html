<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEECS Helpdesk</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="crest" aria-hidden="true">S</div>
    <div class="header-text">
      <div class="header-title">SEECS Helpdesk</div>
      <div class="header-sub">Handbooks · forms · course policy</div>
    </div>
    <div class="header-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting</span>
    </div>
  </header>

  <main class="thread" id="thread">
    <div class="intro">
      <p class="intro-lede">Ask about SEECS or NUST academic policy, handbooks, or forms.</p>
      <p class="intro-sub">If something isn't in the documents, I'll say so — and can draft a help request instead.</p>
    </div>
  </main>

  <div class="composer">
    <form id="composerForm" class="composer-form">
      <textarea
        id="messageInput"
        class="composer-input"
        placeholder="Ask about elective changes, thesis deadlines, course requisites…"
        rows="1"
        autofocus
      ></textarea>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
          <path d="M2.5 10L17.5 2.5L13.5 17.5L9.5 11.5L2.5 10Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M9.5 11.5L13 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
    <div class="composer-foot">
      <button type="button" class="reset-link" id="resetBtn">Start a new conversation</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
